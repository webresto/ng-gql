name: Publish Package to npmjs

on:
  push:
    branches:
      - master
      - alpha
      - next

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install 2>&1 || true && TZ=GMT-3 npm run test
      - run: npm run build

      - name: Publish to npm (master)
        if: github.ref_name == 'master'
        run: npm publish
        working-directory: ./dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish preview to npm (alpha/next)
        if: github.ref_name != 'master'
        working-directory: ./dist
        run: |
          set -euo pipefail
          BRANCH=${GITHUB_REF_NAME}
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          npm version "${BASE_VERSION}-${BRANCH}.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          npm publish --tag "$BRANCH"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
